<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Timetables, marks, attendance and assignments for students and staff." />
    <meta name="theme-color" content="#2d5a4a" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Eduportal</title>
    <script>
      // apply the saved theme before first paint, so dark mode doesn't flash white
      try {
        const t = localStorage.getItem('eduportal.theme')
        if (t === 'dark' || ((!t || t === 'system') && matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark')
        }
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

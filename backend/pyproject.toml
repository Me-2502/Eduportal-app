[project]
name = "eduportal-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "bcrypt>=5.0.0",
    "fastapi[standard]>=0.143.3",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.0",
    "pyjwt>=2.15.1",
    "slowapi>=0.1.10",
    "sqlalchemy>=2.1.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
